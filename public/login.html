<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Achats Cuisine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body class="login-bg d-flex align-items-center min-vh-100">
  <div class="container" style="max-width: 400px">
    <div class="card shadow border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="display-5">🥕🍎</div>
          <h4 class="fw-bold mb-0">Achats Cuisine</h4>
          <div class="text-muted small">Gestion des achats de légumes et fruits</div>
        </div>
        <div id="err" class="alert alert-danger py-2 small d-none"></div>
        <form id="form-login">
          <div class="mb-3">
            <label class="form-label">Identifiant</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input id="username" class="form-control" autocomplete="username" required autofocus>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Mot de passe</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input id="password" type="password" class="form-control" autocomplete="current-password" required>
            </div>
          </div>
          <button class="btn btn-success w-100" type="submit">
            <span class="spinner-border spinner-border-sm d-none"></span> Se connecter
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script>
    $('#form-login').on('submit', function (e) {
      e.preventDefault();
      const $btn = $(this).find('button').prop('disabled', true);
      $btn.find('.spinner-border').removeClass('d-none');
      $('#err').addClass('d-none');
      $.ajax({
        url: '/api/login', method: 'POST', contentType: 'application/json', dataType: 'json',
        data: JSON.stringify({ username: $('#username').val(), password: $('#password').val() })
      }).done(() => { location.href = '/app'; })
        .fail(xhr => {
          $('#err').text(xhr.responseJSON?.error || 'Erreur de connexion').removeClass('d-none');
          $btn.prop('disabled', false).find('.spinner-border').addClass('d-none');
        });
    });
  </script>
</body>
</html>
