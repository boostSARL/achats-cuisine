services:
  - type: web
    name: achats-cuisine
    runtime: node
    plan: free               # ⚠️ données effacées à chaque redémarrage / mise en veille
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD   # mot de passe initial du compte "admin"
        sync: false
      - key: TZ
        value: Africa/Casablanca
    # Pour garder les données, passer au plan "starter" et ajouter :
    #   - key: DATA_DIR
    #     value: /var/data
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
